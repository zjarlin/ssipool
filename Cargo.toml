[package]
name = "ssipool"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Single-system-image research for one Linux guest across physical machines"
license = "MIT"
repository = "https://github.com/zjarlin/ssipool"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
