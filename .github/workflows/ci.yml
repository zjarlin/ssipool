name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/feature-status.py --check
      - run: python3 -m unittest discover -s scripts/ssi-lab -p 'test_*.py'
      - if: runner.os == 'Linux'
        run: |
          cc -O2 -Wall -Wextra -Werror -static -pthread scripts/ssi-lab/guest-stress.c -o "$RUNNER_TEMP/guest-stress"
          cc -O2 -Wall -Wextra -Werror -static -pthread scripts/ssi-lab/guest-io-order.c -o "$RUNNER_TEMP/guest-io-order"
          probe_status=0
          "$RUNNER_TEMP/guest-io-order" || probe_status=$?
          test "$probe_status" -eq 2
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/guest-clock.c -o "$RUNNER_TEMP/guest-clock"
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/guest-pause.c -o "$RUNNER_TEMP/guest-pause"
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/guest-rtc.c -o "$RUNNER_TEMP/guest-rtc"
          rtc_status=0
          "$RUNNER_TEMP/guest-rtc" || rtc_status=$?
          test "$rtc_status" -eq 2
          copyset_status=0
          python3 scripts/ssi-lab/probe-copyset-retry.py --require-kernel kernel-must-not-match \
            --output "$RUNNER_TEMP/copyset-must-not-exist.json" || copyset_status=$?
          test "$copyset_status" -eq 2
          test ! -e "$RUNNER_TEMP/copyset-must-not-exist.json"
          failure_status=0
          python3 scripts/ssi-lab/probe-failure-propagation.py --require-kernel kernel-must-not-match \
            --mode malformed --output "$RUNNER_TEMP/failure-must-not-exist.json" || failure_status=$?
          test "$failure_status" -eq 2
          test ! -e "$RUNNER_TEMP/failure-must-not-exist.json"
          drain_status=0
          python3 scripts/ssi-lab/probe-kernel-drain.py --require-kernel kernel-must-not-match \
            --mode active --output "$RUNNER_TEMP/drain-must-not-exist.json" || drain_status=$?
          test "$drain_status" -eq 2
          test ! -e "$RUNNER_TEMP/drain-must-not-exist.json"
          admission_status=0
          python3 scripts/ssi-lab/probe-ioctl-admission.py --require-kernel kernel-must-not-match \
            --mode validation --output "$RUNNER_TEMP/admission-must-not-exist.json" || admission_status=$?
          test "$admission_status" -eq 2
          test ! -e "$RUNNER_TEMP/admission-must-not-exist.json"
          exchange_status=0
          python3 scripts/ssi-lab/probe-exchanges.py --require-kernel kernel-must-not-match \
            --mode reverse --output "$RUNNER_TEMP/exchanges-must-not-exist.json" || exchange_status=$?
          test "$exchange_status" -eq 2
          test ! -e "$RUNNER_TEMP/exchanges-must-not-exist.json"
          pins_status=0
          python3 scripts/ssi-lab/probe-pins.py --require-kernel kernel-must-not-match \
            --mode service --output "$RUNNER_TEMP/pins-must-not-exist.json" || pins_status=$?
          test "$pins_status" -eq 2
          test ! -e "$RUNNER_TEMP/pins-must-not-exist.json"
          release_status=0
          python3 scripts/ssi-lab/probe-pin-release.py --require-kernel kernel-must-not-match \
            --mode dependency --output "$RUNNER_TEMP/release-must-not-exist.json" || release_status=$?
          test "$release_status" -eq 2
          test ! -e "$RUNNER_TEMP/release-must-not-exist.json"
          map_status=0
          python3 scripts/ssi-lab/probe-qemu-map.py --require-kernel kernel-must-not-match \
            --require-sha256 invalid --pid 1 --qmp "$RUNNER_TEMP/no-qmp.sock" --mode 0 \
            --output "$RUNNER_TEMP/map-must-not-exist.json" || map_status=$?
          test "$map_status" -eq 2
          test ! -e "$RUNNER_TEMP/map-must-not-exist.json"
          flush_status=0
          python3 scripts/ssi-lab/probe-shutdown-flush.py --require-kernel kernel-must-not-match \
            --qemu "$RUNNER_TEMP/no-qemu" --require-sha256 invalid --firmware "$RUNNER_TEMP" \
            --error 5 --directory "$RUNNER_TEMP/flush-must-not-exist" || flush_status=$?
          test "$flush_status" -eq 2
          test ! -e "$RUNNER_TEMP/flush-must-not-exist"
          virtio_status=0
          python3 scripts/ssi-lab/probe-virtio-pending.py --require-kernel kernel-must-not-match \
            --qemu "$RUNNER_TEMP/no-qemu" --require-sha256 invalid --firmware "$RUNNER_TEMP" \
            --guest-kernel "$RUNNER_TEMP/no-kernel" --guest-kernel-sha256 invalid \
            --initramfs "$RUNNER_TEMP/no-initramfs" --initramfs-sha256 invalid \
            --error 5 --action quit --directory "$RUNNER_TEMP/virtio-must-not-exist" || virtio_status=$?
          test "$virtio_status" -eq 2
          test ! -e "$RUNNER_TEMP/virtio-must-not-exist"
          dsm_virtio_status=0
          python3 scripts/ssi-lab/probe-virtio-dsm-pins.py --require-kernel kernel-must-not-match \
            --qemu "$RUNNER_TEMP/no-qemu" --require-sha256 invalid --firmware "$RUNNER_TEMP" \
            --guest-kernel "$RUNNER_TEMP/no-kernel" --guest-kernel-sha256 invalid \
            --initramfs "$RUNNER_TEMP/no-initramfs" --initramfs-sha256 invalid \
            --node 0 --peers 127.0.0.1 127.0.0.2 --error 5 \
            --directory "$RUNNER_TEMP/dsm-virtio-must-not-exist" || dsm_virtio_status=$?
          test "$dsm_virtio_status" -eq 2
          test ! -e "$RUNNER_TEMP/dsm-virtio-must-not-exist"
          sh -n scripts/ssi-lab/guest-block-init.sh
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/probe-pvclock.c -o "$RUNNER_TEMP/probe-pvclock"
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/probe-dsm-startup.c -o "$RUNNER_TEMP/probe-dsm-startup"
          cc -O2 -Wall -Wextra -Werror -static scripts/ssi-lab/probe-dsm-request.c -o "$RUNNER_TEMP/probe-dsm-request"
          cc -O2 -Wall -Wextra -Werror -static -pthread scripts/ssi-lab/probe-dsm-latency.c -o "$RUNNER_TEMP/probe-dsm-latency"
          cc -O2 -Wall -Wextra -Werror -static -pthread scripts/ssi-lab/probe-write-grant.c -o "$RUNNER_TEMP/probe-write-grant"
          cc -O2 -Wall -Wextra -Werror -static -pthread scripts/ssi-lab/probe-tsc-frequency.c -o "$RUNNER_TEMP/probe-tsc-frequency"
          tsc_status=0
          "$RUNNER_TEMP/probe-tsc-frequency" kernel-must-not-match native || tsc_status=$?
          test "$tsc_status" -eq 2
          grant_status=0
          "$RUNNER_TEMP/probe-write-grant" 0 127.0.0.1 - kernel-must-not-match || grant_status=$?
          test "$grant_status" -eq 2
          atomic_status=0
          "$RUNNER_TEMP/probe-write-grant" 0 127.0.0.1 - kernel-must-not-match --atomic || atomic_status=$?
          test "$atomic_status" -eq 2
          latency_status=0
          "$RUNNER_TEMP/probe-dsm-latency" 0 127.0.0.1 - kernel-must-not-match || latency_status=$?
          test "$latency_status" -eq 2
          request_status=0
          "$RUNNER_TEMP/probe-dsm-request" kernel-must-not-match || request_status=$?
          test "$request_status" -eq 2
          safety_status=0
          python3 scripts/ssi-lab/probe-request-safety.py --worker "$RUNNER_TEMP/probe-dsm-request" \
            --require-kernel kernel-must-not-match --mode malformed \
            --output "$RUNNER_TEMP/safety-must-not-exist.json" || safety_status=$?
          test "$safety_status" -eq 2
          test ! -e "$RUNNER_TEMP/safety-must-not-exist.json"
          startup_status=0
          "$RUNNER_TEMP/probe-dsm-startup" kernel-must-not-match occupied || startup_status=$?
          test "$startup_status" -eq 2
          bash -n scripts/ssi-lab/run-node.sh scripts/ssi-lab/build-host-kernel.sh
          sh -n scripts/ssi-lab/guest-ssh-init.sh
